<!DOCTYPE html>
<!-- Program 6: To-Do List (JS) -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>

<body>
    <h1 align="center">To-Do List</h1>
    <input type="text" id="task" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <ol id="tlist"></ol>

    <script>
        function addTask() {
            let input = document.getElementById("task");
            let task = input.value.trim();

            if (!task) {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");
            // 1. Render structure with an empty span
            li.innerHTML = `<span></span> 
                <button onclick="editTask(this)">Edit</button> 
                <button onclick="this.parentElement.remove()">Delete</button>`;

            // 2. Safely inject task text (immune to XSS)
            li.querySelector("span").textContent = task;

            document.getElementById("tlist").appendChild(li);
            input.value = "";
        }


        function editTask(btn) {
            let span = btn.parentElement.querySelector("span");
            let newTask = prompt("Edit Task:", span.textContent);
            if (newTask) {
                span.textContent = newTask;
            }
        }
    </script>
</body>

</html>
