    :root {

    /* Carousel Container & Smooth Faded Edges */
    .tech-carousel {
      /* overflow: hidden; */
      padding: 20px 0;
      background: rgba(255, 255, 255, 0.03);
      border-block: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      mask-image: linear-gradient(to right, transparent, #000 150px, #000 calc(100% - 150px), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, #000 150px, #000 calc(100% - 150px), transparent);
    }

    /* Sliding Track */
    .track {
      /* display: flex; */
      width: max-content;
      animation: scroll 8s linear infinite;
    }

    .tech-carousel:hover .track {
      animation-play-state: paused;
    }

    .track img {
      height: 8%; /* Controls icon row height */
      object-fit: contain;
    }

    @keyframes scroll {
      to { transform: translateX(-70%); }
    }
    .MyLinks{
        text-align: center;
    }
  </style>
