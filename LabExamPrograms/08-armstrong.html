<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Armstrong Number</title>
    <script>
        // Way 1: Easiest to remember or to execute (String iteration)
        function isArmstrong(num) {
            let sum = 0;

            for (let i = 0; i < num.length; i++) {
                sum += num[i] ** num.length;
                if (sum > num) return false; // early exit 
            }

            return num !== "" && sum == num;
        }

        // Way 2: split() + reduce() (shorter, but uses O(d) extra space for the array)

        // function isArmstrong(num) {
        //     const digits = num.split("");
        //     const sum = digits.reduce((acc, digit) => acc + digit ** digits.length, 0);
        //     return num !== "" && sum == num;
        // }

        // DOM Update function
        function checkArmstrong() {
            let num = document.getElementById('number').value;
            let result = document.getElementById('result');

            if (isArmstrong(num)) {
                result.innerHTML = `${num} is an Armstrong number`;
            } else {
                result.innerHTML = `${num} is not an Armstrong number`;
            }
        }
    </script>
</head>

<body>
    <label for="number">Enter a number:</label>
    <input type="text" id="number" placeholder="Enter a number">
    <button type="button" onclick="checkArmstrong()">Check</button>
    <p id="result" aria-live="polite"></p>
</body>

</html>
