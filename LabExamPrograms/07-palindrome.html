<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Palindrome</title>
    <script>
        // function isPalindrome(str) {

        //         document.getElementById('result').innerHTML = `${str} is a palindrome`;
        //     }
        //     else {
        //         document.getElementById('result').innerHTML = `${str} is not a palindrome`;
        //     }
        // }

        function isPalindrome(str) {
            let j = str.length - 1;
            for (let i = 0; i < str.length / 2; i++) {
                if (str[i] !== str[j]) {
                    document.getElementById('result').innerHTML = `${str} is not a palindrome`;
                    return;
                }
                j--;
            }
            document.getElementById('result').innerHTML = `${str} is a palindrome`;
        }
    </script>
</head>

<body>
    <label for="string">Enter a string:</label>
    <input type="text" id="str" placeholder="Enter a string">
    <button type="button" onclick="isPalindrome(document.getElementById('str').value)">Check</button>
    <p id="result" aria-live="polite"></p>
</body>

</html>
